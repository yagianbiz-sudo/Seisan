<title>おくりむかえ帳</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Zen+Maru+Gothic:wght@500;700;900&display=swap">
<style>
/* Layout: one-column phone app, bottom tab bar; two parents = two fixed colors (a / b), trade requests drawn as playing cards */
:root {
  --bg: #EDF0F5;
  --surface: #FFFFFF;
  --ink: #1C2333;
  --muted: #5E6779;
  --line: #D8DDE7;
  --a: #0E8A7B;
  --a-soft: #DDF2EE;
  --b: #C9850A;
  --b-soft: #FBEFD6;
  --card: #2B2F6B;
  --card-ink: #F4F3FF;
  --card-gold: #F5C451;
  --danger: #C2413A;
  --display: "Zen Maru Gothic", "Hiragino Maru Gothic ProN", "Hiragino Sans", sans-serif;
  --body: "Hiragino Sans", "Noto Sans JP", "Yu Gothic UI", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11151E; --surface: #1A2030; --ink: #E7EBF3; --muted: #9AA3B5; --line: #2C3446;
    --a: #3CC2AE; --a-soft: #173A36; --b: #F0B445; --b-soft: #3A2E15;
    --card: #2A2F66; --card-ink: #F4F3FF; --card-gold: #F5C451; --danger: #EE7A72;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11151E; --surface: #1A2030; --ink: #E7EBF3; --muted: #9AA3B5; --line: #2C3446;
  --a: #3CC2AE; --a-soft: #173A36; --b: #F0B445; --b-soft: #3A2E15;
  --card: #2A2F66; --card-ink: #F4F3FF; --card-gold: #F5C451; --danger: #EE7A72;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.6; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, input:focus-visible, select:focus-visible, textarea:focus-visible { outline: 3px solid var(--a); outline-offset: 2px; }
.app { max-width: 560px; margin: 0 auto; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px calc(96px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 20px; }
h1, h2, h3 { font-family: var(--display); text-wrap: balance; margin: 0; }
h1 { font-size: 24px; font-weight: 900; }
h2 { font-size: 17px; font-weight: 700; }
.eyebrow { font-size: 12px; letter-spacing: .08em; color: var(--muted); font-weight: 700; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 10px; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 16px; display: flex; flex-direction: column; gap: 12px; }
.top { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; }
.who-me { font-size: 13px; color: var(--muted); background: none; border: 1px solid var(--line); border-radius: 999px; padding: 4px 12px; }

.pchip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 12px; border-radius: 999px; font-weight: 700; font-size: 14px; white-space: nowrap; }
.pchip.a { background: var(--a-soft); color: var(--a); }
.pchip.b { background: var(--b-soft); color: var(--b); }
.pchip .you { font-size: 11px; font-weight: 700; opacity: .85; }
.dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; flex: none; }
.dot.a { background: var(--a); } .dot.b { background: var(--b); }

.banner { display: flex; gap: 12px; align-items: center; background: var(--card); color: var(--card-ink); border: none; border-radius: 16px; padding: 14px 16px; text-align: left; width: 100%; }
.banner .mini { width: 34px; height: 46px; border-radius: 6px; border: 2px solid var(--card-gold); display: grid; place-items: center; color: var(--card-gold); font-family: var(--display); font-weight: 900; flex: none; }
.banner b { font-family: var(--display); font-size: 16px; }

.day { display: flex; flex-direction: column; gap: 6px; }
.day + .day { border-top: 1px solid var(--line); padding-top: 12px; }
.dayhead { display: flex; justify-content: space-between; align-items: center; background: none; border: none; padding: 0; text-align: left; }
.dayhead .d { font-family: var(--display); font-weight: 700; font-size: 16px; }
.dayhead .today { font-size: 11px; background: var(--ink); color: var(--bg); border-radius: 999px; padding: 1px 8px; margin-left: 6px; vertical-align: 2px; }
.leg { display: grid; grid-template-columns: 1fr auto; gap: 8px; align-items: center; width: 100%; background: var(--bg); border: 1px solid transparent; border-radius: 12px; padding: 8px 10px; text-align: left; }
.leg:hover { border-color: var(--line); }
.leg .what { min-width: 0; }
.leg .kid { font-weight: 700; }
.leg .tag { font-size: 12px; color: var(--muted); margin-left: 6px; }
.leg .pend { font-size: 11px; color: var(--card); background: var(--card-gold); border-radius: 4px; padding: 0 6px; margin-left: 6px; font-weight: 700; }
.off { font-size: 13px; color: var(--muted); }

.score { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.score .p { border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 2px; }
.score .p.a { background: var(--a-soft); } .score .p.b { background: var(--b-soft); }
.score .name { font-weight: 700; font-size: 14px; }
.score .p.a .name, .score .p.a .num { color: var(--a); }
.score .p.b .name, .score .p.b .num { color: var(--b); }
.score .num { font-family: var(--display); font-weight: 900; font-size: 40px; line-height: 1.1; font-variant-numeric: tabular-nums; }
.score .num small { font-size: 15px; font-weight: 700; margin-left: 2px; }
.ratio { display: flex; height: 14px; border-radius: 999px; overflow: hidden; background: var(--line); }
.ratio .a { background: var(--a); } .ratio .b { background: var(--b); }
.verdict { font-family: var(--display); font-weight: 700; font-size: 16px; }
table.brk { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
table.brk th, table.brk td { padding: 6px 4px; border-bottom: 1px solid var(--line); text-align: right; }
table.brk th:first-child, table.brk td:first-child { text-align: left; }
table.brk th { font-size: 12px; color: var(--muted); font-weight: 700; }
.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; width: 36px; height: 36px; }

.tcard { background: var(--card); color: var(--card-ink); border-radius: 18px; padding: 18px; display: flex; flex-direction: column; gap: 10px; position: relative; box-shadow: 0 6px 18px rgba(20, 22, 60, .25); border: 2px solid var(--card-gold); }
.tcard .kind { font-size: 12px; letter-spacing: .12em; color: var(--card-gold); font-weight: 700; }
.tcard .main { font-family: var(--display); font-weight: 900; font-size: 22px; line-height: 1.35; }
.tcard .arrow { font-size: 14px; }
.tcard .ret { font-size: 14px; background: rgba(255,255,255,.08); border-radius: 10px; padding: 8px 10px; }
.tcard .note { font-size: 14px; margin: 0; padding-left: 10px; border-left: 3px solid var(--card-gold); }
.tcard .btns { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.tcard .btns button { border-radius: 12px; padding: 10px; font-weight: 700; border: 1px solid rgba(255,255,255,.35); background: transparent; color: var(--card-ink); }
.tcard .btns button.yes { background: var(--card-gold); color: #2B2F6B; border-color: var(--card-gold); }
.hist { display: flex; justify-content: space-between; gap: 8px; font-size: 13px; padding: 6px 0; border-bottom: 1px solid var(--line); }
.hist .st { white-space: nowrap; font-weight: 700; }
.balance { font-family: var(--display); font-weight: 700; font-size: 18px; }

.btn { border: none; border-radius: 12px; padding: 12px 16px; font-weight: 700; background: var(--ink); color: var(--bg); width: 100%; }
.btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.btn.danger { background: transparent; color: var(--danger); border: 1px solid var(--line); }
.btn.card { background: var(--card); color: var(--card-ink); }
.linkbtn { background: none; border: none; color: var(--muted); text-decoration: underline; padding: 0; font-size: 13px; }

label.f { display: flex; flex-direction: column; gap: 4px; font-size: 13px; color: var(--muted); font-weight: 700; }
input[type=text], select, textarea { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 9px 10px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
.two { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.kidrow { display: grid; grid-template-columns: 1fr 1fr auto; gap: 8px; align-items: end; }
.kidrow button { border: 1px solid var(--line); background: transparent; border-radius: 10px; height: 42px; width: 42px; }
.wdays { display: flex; gap: 6px; flex-wrap: wrap; }
.wdays button { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: transparent; font-weight: 700; }
.wdays button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.gridwrap { overflow-x: auto; }
table.pat { border-collapse: separate; border-spacing: 4px; font-size: 13px; }
table.pat th { font-weight: 700; color: var(--muted); padding: 2px 4px; white-space: nowrap; }
table.pat td button { border: none; border-radius: 8px; padding: 6px 8px; min-width: 64px; font-weight: 700; }
table.pat td button.a { background: var(--a-soft); color: var(--a); }
table.pat td button.b { background: var(--b-soft); color: var(--b); }
.chips { display: flex; gap: 6px; flex-wrap: wrap; }
.chips button { border: 1px solid var(--line); background: var(--surface); border-radius: 999px; padding: 4px 12px; font-size: 13px; }
.preview { background: var(--bg); border-radius: 12px; padding: 10px 12px; font-size: 14px; display: flex; flex-direction: column; gap: 4px; }

.tabs { position: fixed; left: 0; right: 0; bottom: 0; background: var(--surface); border-top: 1px solid var(--line); padding-bottom: env(safe-area-inset-bottom, 0px); padding-left: max(8px, env(safe-area-inset-left, 0px)); padding-right: max(8px, env(safe-area-inset-right, 0px)); z-index: 5; }
.tabs .in { max-width: 560px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); }
.tabs button { background: none; border: none; padding: 10px 0 12px; font-size: 12px; font-weight: 700; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 2px; position: relative; }
.tabs button .ic { font-family: var(--display); font-size: 18px; line-height: 1; }
.tabs button.on { color: var(--ink); }
.tabs .badge { position: absolute; top: 4px; left: calc(50% + 8px); background: var(--danger); color: #fff; border-radius: 999px; font-size: 11px; min-width: 18px; height: 18px; display: grid; place-items: center; padding: 0 5px; }

.scrim { position: fixed; inset: 0; background: rgba(10, 12, 20, .45); z-index: 20; display: flex; align-items: flex-end; justify-content: center; }
.sheet { background: var(--surface); width: 100%; max-width: 560px; border-radius: 20px 20px 0 0; padding: 20px max(16px, env(safe-area-inset-left, 0px)) calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; max-height: 88vh; overflow-y: auto; }
.sheet .x { align-self: flex-end; background: none; border: none; color: var(--muted); font-size: 14px; padding: 0; }
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(84px + env(safe-area-inset-bottom, 0px)); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px; z-index: 30; max-width: calc(100% - 32px); }
.pick { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.pick button { border-radius: 16px; padding: 18px 10px; font-family: var(--display); font-weight: 900; font-size: 20px; border: 2px solid transparent; }
.pick button.a { background: var(--a-soft); color: var(--a); border-color: var(--a); }
.pick button.b { background: var(--b-soft); color: var(--b); border-color: var(--b); }
.mode { font-size: 12px; color: var(--muted); text-align: center; }
@media (prefers-reduced-motion: no-preference) {
  .tcard { animation: deal .35s ease-out; }
  @keyframes deal { from { transform: translateY(8px) rotate(-1.5deg); opacity: .6; } to { transform: none; opacity: 1; } }
}
</style>

<div class="app" id="app"><p class="muted">読み込み中…</p></div>
<nav class="tabs" id="tabs" hidden></nav>
<div id="overlay"></div>
<div class="toast" id="toast" hidden></div>

<script>
(() => {
  const WD = ['日', '月', '火', '水', '木', '金', '土'];
  const LEG = { drop: '送り', pick: '迎え' };
  const REASONS = ['急な会議', '出張', '飲み会', '体調不良', '残業', '雨なので'];
  const LS_DATA = 'okurimukae-data-v1', LS_ME = 'okurimukae-me';

  const pad = n => String(n).padStart(2, '0');
  const keyOf = d => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  const parse = k => { const [y, m, d] = k.split('-').map(Number); return new Date(y, m - 1, d); };
  const addDays = (d, n) => { const x = new Date(d); x.setDate(x.getDate() + n); return x; };
  const fmt = k => { const d = parse(k); return `${d.getMonth() + 1}/${d.getDate()}(${WD[d.getDay()]})`; };
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const newId = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);
  const lsGet = k => { try { return localStorage.getItem(k); } catch { return null; } };
  const lsSet = (k, v) => { try { localStorage.setItem(k, v); } catch {} };
  const todayKey = () => keyOf(new Date());

  // ---------- state ----------
  const S = { settings: null, days: {}, trades: {}, loaded: false };
  let me = lsGet(LS_ME);
  let view = 'home';
  let sheet = null;
  let monthOffset = 0;
  let draft = null;

  // ---------- storage: shared db when the viewer grants it, this phone only otherwise ----------
  const store = {
    mode: 'local', db: null,
    async init() {
      let db = null;
      try { db = window.claude ? await window.claude.use('db') : null; } catch { db = null; }
      if (db) {
        this.mode = 'db'; this.db = db;
        db.doc('app/settings').onSnapshot(s => { S.settings = s.exists ? s.data() : null; S.loaded = true; render(); }, onDbError);
        db.collection('days').onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.days = o; render(); }, onDbError);
        db.collection('trades').orderBy('createdAt', 'desc').limit(300).onSnapshot(q => { const o = {}; q.docs.forEach(d => o[d.id] = d.data()); S.trades = o; render(); }, onDbError);
      } else {
        try { const saved = JSON.parse(lsGet(LS_DATA) || 'null'); if (saved) Object.assign(S, saved); } catch {}
        S.loaded = true; render();
      }
    },
    persistLocal() { lsSet(LS_DATA, JSON.stringify({ settings: S.settings, days: S.days, trades: S.trades })); },
    async put(kind, id, body) {
      if (kind === 'settings') S.settings = body; else S[kind][id] = body;
      render();
      if (this.mode === 'db') {
        const path = kind === 'settings' ? 'app/settings' : `${kind}/${id}`;
        try { await this.db.doc(path).set(body); }
        catch (e) {
          if (e && e.code === 'unavailable') { await new Promise(r => setTimeout(r, 600 + Math.random() * 600)); try { await this.db.doc(path).set(body); return; } catch {} }
          toast(e && e.code === 'invalid_argument' ? '保存できませんでした。この画面を編集できる権限があるか確認してください。' : '保存できませんでした。通信を確認してもう一度試してください。');
        }
      } else this.persistLocal();
    }
  };
  function onDbError() { toast('共有データとの接続が切れました。ページを開き直してください。'); }

  // ---------- domain ----------
  const other = p => p === 'a' ? 'b' : 'a';
  const pname = p => (S.settings?.names?.[p]) || (p === 'a' ? 'A' : 'B');
  const kidName = id => (S.settings?.kids || []).find(k => k.id === id)?.name || '（削除された子）';
  const legKey = (kid, leg) => `${kid}-${leg}`;
  const defaultWho = (kidIdx, leg) => kidIdx % 2 === 0 ? 'a' : 'b';
  const isActive = k => { const st = S.settings; if (!st || (st.startDate && k < st.startDate)) return false; return st.weekdays.includes(parse(k).getDay()) && !S.days[k]?.off; };
  const whoFor = (k, kid, leg) => {
    const st = S.settings, lk = legKey(kid, leg);
    return S.days[k]?.legs?.[lk] || st.pattern?.[parse(k).getDay()]?.[lk] || 'a';
  };
  const legsOf = k => isActive(k) ? S.settings.kids.flatMap(kd => ['drop', 'pick'].map(leg => ({ date: k, kid: kd.id, leg, who: whoFor(k, kd.id, leg) }))) : [];
  const legLabel = l => `${fmt(l.date)} ${kidName(l.kid)}の${LEG[l.leg]}`;
  const tradeList = () => Object.entries(S.trades).map(([id, t]) => ({ id, ...t })).sort((x, y) => (y.createdAt || 0) - (x.createdAt || 0));
  const pendingFor = l => tradeList().find(t => t.status === 'pending' && t.date === l.date && t.kid === l.kid && t.leg === l.leg);
  const incoming = () => me ? tradeList().filter(t => t.status === 'pending' && t.to === me) : [];

  function monthStats(offset) {
    const base = new Date(); base.setDate(1); base.setMonth(base.getMonth() + offset);
    const y = base.getFullYear(), m = base.getMonth(), last = new Date(y, m + 1, 0).getDate(), tk = todayKey();
    const z = () => ({ total: 0, done: 0, drop: 0, pick: 0 });
    const out = { label: `${y}年${m + 1}月`, a: z(), b: z(), kids: {} };
    for (let d = 1; d <= last; d++) {
      const k = keyOf(new Date(y, m, d));
      for (const l of legsOf(k)) {
        const p = out[l.who]; p.total++; p[l.leg]++; if (k <= tk) p.done++;
        out.kids[l.kid] = out.kids[l.kid] || { a: 0, b: 0 }; out.kids[l.kid][l.who]++;
      }
    }
    return out;
  }
  // positive: b owes a. A trade with no return favor leaves its sender owing one.
  function balance() {
    let n = 0;
    for (const t of tradeList()) if (t.status === 'accepted' && !t.ret) n += t.from === 'b' ? 1 : -1;
    return n;
  }

  // ---------- actions ----------
  async function applyLegs(changes) {
    const byDay = {};
    for (const c of changes) (byDay[c.date] = byDay[c.date] || []).push(c);
    for (const [date, cs] of Object.entries(byDay)) {
      const cur = S.days[date] || {};
      const legs = { ...(cur.legs || {}) };
      for (const c of cs) legs[legKey(c.kid, c.leg)] = c.who;
      await store.put('days', date, { ...cur, legs });
    }
  }
  async function sendTrade(l, retStr, note) {
    const ret = retStr ? JSON.parse(retStr) : null;
    await store.put('trades', newId(), { kind: 'request', from: me, to: other(me), date: l.date, kid: l.kid, leg: l.leg, ret, note: note.trim(), status: 'pending', createdAt: Date.now() });
    closeSheet(); toast(`${pname(other(me))}にトレード依頼を送りました`);
  }
  async function answer(id, ok) {
    const t = S.trades[id]; if (!t || t.status !== 'pending') return;
    await store.put('trades', id, { ...t, status: ok ? 'accepted' : 'declined', answeredAt: Date.now() });
    if (ok) {
      const ch = [{ date: t.date, kid: t.kid, leg: t.leg, who: t.to }];
      if (t.ret) ch.push({ ...t.ret, who: t.from });
      await applyLegs(ch);
      toast('トレード成立。予定を書き換えました');
    } else toast('お断りしました');
  }
  async function cancelTrade(id) {
    const t = S.trades[id]; if (!t) return;
    await store.put('trades', id, { ...t, status: 'cancelled', answeredAt: Date.now() });
    toast('依頼を取り消しました');
  }
  async function takeOver(l) {
    await store.put('trades', newId(), { kind: 'take', from: l.who, to: me, date: l.date, kid: l.kid, leg: l.leg, ret: null, note: '', status: 'accepted', createdAt: Date.now(), answeredAt: Date.now() });
    await applyLegs([{ ...l, who: me }]);
    closeSheet(); toast(`引き受けました。${pname(l.who)}への貸しが1回つきました`);
  }
  async function setOff(date, off) {
    const cur = S.days[date] || {};
    await store.put('days', date, { ...cur, off });
    closeSheet(); toast(off ? `${fmt(date)}は送迎なしにしました` : `${fmt(date)}の送迎を戻しました`);
  }

  // ---------- render ----------
  const app = document.getElementById('app');
  const tabs = document.getElementById('tabs');
  const overlay = document.getElementById('overlay');

  function chip(p) { return `<span class="pchip ${p}"><span class="dot ${p}"></span>${esc(pname(p))}${p === me ? '<span class="you">あなた</span>' : ''}</span>`; }

  function render() {
    if (!S.loaded) return;
    if (!S.settings) { view = 'settings'; if (!draft) draft = freshDraft(); }
    if (S.settings && (me !== 'a' && me !== 'b')) { app.innerHTML = pickMe(); tabs.hidden = true; overlay.innerHTML = ''; return; }
    app.innerHTML = view === 'home' ? home() : view === 'trade' ? trades() : view === 'stats' ? stats() : settings();
    if (S.settings) {
      const n = incoming().length;
      tabs.hidden = false;
      tabs.innerHTML = `<div class="in">${[['home', '日', '予定'], ['trade', '札', 'トレード'], ['stats', '計', '集計'], ['settings', '設', '設定']].map(([v, ic, lb]) =>
        `<button data-act="tab" data-v="${v}" class="${view === v ? 'on' : ''}" aria-label="${lb}"><span class="ic">${ic}</span>${lb}${v === 'trade' && n ? `<span class="badge">${n}</span>` : ''}</button>`).join('')}</div>`;
    } else tabs.hidden = true;
    renderSheet();
  }

  function pickMe() {
    return `<div class="stack"><h1>あなたはどちら？</h1><p class="muted">この端末を使う人を選んでください。スマホごとに1回だけ聞きます。</p>
      <div class="pick"><button class="a" data-act="me" data-p="a">${esc(pname('a'))}</button><button class="b" data-act="me" data-p="b">${esc(pname('b'))}</button></div></div>`;
  }

  function home() {
    const tk = todayKey(), n = incoming().length;
    const st = monthStats(0);
    const days = [];
    for (let i = 0; i < 8; i++) days.push(keyOf(addDays(new Date(), i)));
    const shown = days.filter(k => S.settings.weekdays.includes(parse(k).getDay()));
    return `
      <div class="top"><div><div class="eyebrow">おくりむかえ帳</div><h1>${fmt(tk)}</h1></div><button class="who-me" data-act="switchme">${esc(pname(me))} で使用中</button></div>
      ${n ? `<button class="banner" data-act="tab" data-v="trade"><span class="mini">札</span><span><b>トレードの依頼が ${n} 件届いています</b><br><span class="small">タップして確認</span></span></button>` : ''}
      <div class="panel">
        <div class="row" style="justify-content:space-between"><h2>${st.label}の送迎回数</h2><button class="linkbtn" data-act="tab" data-v="stats">くわしく</button></div>
        ${scoreBlock(st)}
      </div>
      <div class="panel">
        <h2>これからの予定</h2>
        <p class="small muted">担当をタップすると、トレード依頼や引き受けができます。</p>
        ${shown.map(k => dayBlock(k, k === tk)).join('') || '<p class="muted">送迎する曜日が設定されていません。</p>'}
      </div>
      <p class="mode">${store.mode === 'db' ? '夫婦で同じデータを共有中' : 'この端末だけに保存中（共有するにはClaudeで公開したページを2人で開いてください）'}</p>`;
  }

  function dayBlock(k, isToday) {
    const legs = legsOf(k);
    return `<div class="day">
      <button class="dayhead" data-act="day" data-k="${k}"><span class="d">${fmt(k)}${isToday ? '<span class="today">今日</span>' : ''}</span>${S.days[k]?.off ? '<span class="off">お休み</span>' : '<span class="small muted">お休みにする</span>'}</button>
      ${legs.map(l => { const p = pendingFor(l); return `<button class="leg" data-act="leg" data-k="${k}" data-kid="${l.kid}" data-leg="${l.leg}">
        <span class="what"><span class="kid">${esc(kidName(l.kid))}</span><span class="tag">${LEG[l.leg]}</span>${p ? '<span class="pend">依頼中</span>' : ''}</span>${chip(l.who)}</button>`; }).join('')}
    </div>`;
  }

  function scoreBlock(st) {
    const A = st.a.total, B = st.b.total, sum = A + B;
    const pa = sum ? Math.round(A / sum * 100) : 50;
    const diff = A - B;
    const verdict = !sum ? '送迎の予定がありません' : diff === 0 ? 'ぴったり半分ずつ' : `${esc(pname(diff > 0 ? 'a' : 'b'))}が ${Math.abs(diff)} 回多い`;
    return `<div class="score">
        <div class="p a"><span class="name">${esc(pname('a'))}</span><span class="num">${A}<small>回</small></span><span class="small muted">今日まで ${st.a.done} 回</span></div>
        <div class="p b"><span class="name">${esc(pname('b'))}</span><span class="num">${B}<small>回</small></span><span class="small muted">今日まで ${st.b.done} 回</span></div>
      </div>
      <div class="ratio" role="img" aria-label="${esc(pname('a'))} ${pa}% / ${esc(pname('b'))} ${100 - pa}%"><span class="a" style="width:${pa}%"></span><span class="b" style="width:${100 - pa}%"></span></div>
      <div class="row" style="justify-content:space-between"><span class="verdict">${verdict}</span><span class="small muted">${pa} : ${100 - pa}</span></div>`;
  }

  function balanceText() {
    const n = balance();
    if (n === 0) return '貸し借りなし';
    const debtor = n > 0 ? 'b' : 'a';
    return `${esc(pname(debtor))} は ${esc(pname(other(debtor)))} に ${Math.abs(n)} 回の借り`;
  }

  function tradeCard(t, mine) {
    const l = { date: t.date, kid: t.kid, leg: t.leg };
    return `<div class="tcard">
      <span class="kind">TRADE ・ ${esc(pname(t.from))}から</span>
      <span class="main">${esc(legLabel(l))}</span>
      <span class="arrow">${esc(pname(t.from))} → <b>${esc(pname(t.to))}</b> に代わってほしい</span>
      ${t.ret ? `<span class="ret">お返し：${esc(legLabel(t.ret))} を ${esc(pname(t.from))} が引き受けます</span>` : `<span class="ret">お返しなし：成立すると ${esc(pname(t.from))} に借りが1回つきます</span>`}
      ${t.note ? `<p class="note">${esc(t.note)}</p>` : ''}
      <div class="btns">${mine ? `<button data-act="cancel" data-id="${t.id}">取り消す</button><button disabled class="yes" style="opacity:.6">返事待ち</button>` : `<button data-act="no" data-id="${t.id}">今回は無理</button><button class="yes" data-act="yes" data-id="${t.id}">受ける</button>`}</div>
    </div>`;
  }

  function trades() {
    const all = tradeList();
    const inc = incoming(), out = all.filter(t => t.status === 'pending' && t.from === me);
    const done = all.filter(t => t.status !== 'pending').slice(0, 30);
    const stLabel = { accepted: '成立', declined: 'お断り', cancelled: '取り消し' };
    return `
      <div><div class="eyebrow">トレード</div><h1>${balanceText()}</h1></div>
      <section class="stack"><h2>届いている依頼</h2>${inc.length ? inc.map(t => tradeCard(t, false)).join('') : '<p class="muted small">届いている依頼はありません。</p>'}</section>
      <section class="stack"><h2>送った依頼</h2>${out.length ? out.map(t => tradeCard(t, true)).join('') : '<p class="muted small">返事待ちの依頼はありません。依頼は「予定」で自分の担当をタップして送れます。</p>'}</section>
      <section class="panel"><h2>これまでのやりとり</h2>
        ${done.length ? done.map(t => `<div class="hist"><span>${esc(legLabel(t))}：${esc(pname(t.from))}→${esc(pname(t.to))}${t.kind === 'take' ? '（自分から引き受け）' : ''}${t.ret ? '・お返しあり' : ''}</span><span class="st">${stLabel[t.status] || ''}</span></div>`).join('') : '<p class="muted small">まだやりとりはありません。</p>'}
      </section>`;
  }

  function stats() {
    const st = monthStats(monthOffset);
    const kids = S.settings.kids;
    return `
      <div class="monthnav"><button data-act="month" data-d="-1" aria-label="前の月">‹</button><h1>${st.label}</h1><button data-act="month" data-d="1" aria-label="次の月">›</button></div>
      <div class="panel">${scoreBlock(st)}<p class="small muted">予定を含む月の合計です。使いはじめた日（${fmt(S.settings.startDate || todayKey())}）より前と、お休みにした日は数えません。</p></div>
      <div class="panel"><h2>内訳</h2>
        <table class="brk"><thead><tr><th></th><th>${esc(pname('a'))}</th><th>${esc(pname('b'))}</th></tr></thead><tbody>
          <tr><td>送り</td><td>${st.a.drop}</td><td>${st.b.drop}</td></tr>
          <tr><td>迎え</td><td>${st.a.pick}</td><td>${st.b.pick}</td></tr>
          ${kids.map(k => `<tr><td>${esc(k.name)}</td><td>${st.kids[k.id]?.a || 0}</td><td>${st.kids[k.id]?.b || 0}</td></tr>`).join('')}
        </tbody></table>
      </div>
      <div class="panel"><h2>トレードの貸し借り</h2><span class="balance">${balanceText()}</span><p class="small muted">お返しなしで代わってもらうと、頼んだ側に借りが1回つきます。</p></div>`;
  }

  function freshDraft() {
    const st = S.settings;
    if (st) return JSON.parse(JSON.stringify(st));
    return { names: { a: 'ママ', b: 'パパ' }, kids: [{ id: newId(), name: '真ん中の子', school: '○○保育園' }, { id: newId(), name: '下の子', school: '△△保育園' }], weekdays: [1, 2, 3, 4, 5], pattern: {} };
  }
  const draftWho = (wd, kidIdx, leg) => draft.pattern?.[wd]?.[legKey(draft.kids[kidIdx].id, leg)] || defaultWho(kidIdx, leg);

  function settings() {
    if (!draft) draft = freshDraft();
    const first = !S.settings;
    const wds = [1, 2, 3, 4, 5, 6, 0];
    const active = wds.filter(w => draft.weekdays.includes(w));
    const nm = p => esc(draft.names[p] || (p === 'a' ? 'A' : 'B'));
    return `
      <div><div class="eyebrow">${first ? 'はじめに' : '設定'}</div><h1>${first ? 'ふたりの送迎パターンを登録' : '基本の送迎パターン'}</h1>
      ${first ? '<p class="muted small">いつもの分担を登録すると、毎日の予定に自動で入ります。下の例を書き換えて保存してください。</p>' : ''}</div>
      <div class="panel"><h2>ふたりの呼び名</h2>
        <div class="two"><label class="f">ひとり目<input type="text" id="name-a" data-f="name" data-p="a" value="${esc(draft.names.a)}"></label>
        <label class="f">ふたり目<input type="text" id="name-b" data-f="name" data-p="b" value="${esc(draft.names.b)}"></label></div>
      </div>
      <div class="panel"><h2>送迎する子ども</h2>
        ${draft.kids.map((k, i) => `<div class="kidrow"><label class="f">名前<input type="text" id="kid-${k.id}" data-f="kid" data-i="${i}" value="${esc(k.name)}"></label>
          <label class="f">園・学校<input type="text" id="school-${k.id}" data-f="school" data-i="${i}" value="${esc(k.school)}"></label>
          <button data-act="delkid" data-i="${i}" aria-label="${esc(k.name)}を削除" ${draft.kids.length < 2 ? 'disabled' : ''}>×</button></div>`).join('')}
        <button class="btn ghost" data-act="addkid">子どもを追加</button>
      </div>
      <div class="panel"><h2>送迎する曜日</h2>
        <div class="wdays">${wds.map(w => `<button data-act="wd" data-w="${w}" class="${draft.weekdays.includes(w) ? 'on' : ''}" aria-pressed="${draft.weekdays.includes(w)}">${WD[w]}</button>`).join('')}</div>
      </div>
      <div class="panel"><h2>いつもの担当</h2><p class="small muted">マスをタップすると ${nm('a')} ⇄ ${nm('b')} が切り替わります。</p>
        <div class="gridwrap"><table class="pat"><thead><tr><th></th>${draft.kids.map(k => `<th colspan="2">${esc(k.name)}</th>`).join('')}</tr>
          <tr><th></th>${draft.kids.map(() => '<th>送り</th><th>迎え</th>').join('')}</tr></thead><tbody>
          ${active.map(w => `<tr><th>${WD[w]}</th>${draft.kids.map((k, i) => ['drop', 'pick'].map(leg => { const p = draftWho(w, i, leg); return `<td><button class="${p}" data-act="cell" data-w="${w}" data-i="${i}" data-leg="${leg}">${nm(p)}</button></td>`; }).join('')).join('')}</tr>`).join('')}
        </tbody></table></div>
      </div>
      <button class="btn" data-act="save">${first ? 'この内容ではじめる' : '保存する'}</button>
      ${first ? '' : `<button class="btn ghost" data-act="switchme">使う人を切り替える（いまは ${esc(pname(me))}）</button>`}`;
  }

  // ---------- sheets ----------
  function renderSheet() {
    if (!sheet) { overlay.innerHTML = ''; return; }
    let body = '';
    if (sheet.type === 'leg') {
      const l = { date: sheet.k, kid: sheet.kid, leg: sheet.leg, who: whoFor(sheet.k, sheet.kid, sheet.leg) };
      const p = pendingFor(l);
      body = `<h2>${esc(legLabel(l))}</h2><div class="row"><span class="muted">いまの担当</span>${chip(l.who)}</div>
        ${p ? `<p class="small">この担当にはトレード依頼が出ています（${esc(pname(p.from))} → ${esc(pname(p.to))}）。</p><button class="btn ghost" data-act="tab" data-v="trade">トレード画面で見る</button>`
        : l.who === me ? `<button class="btn card" data-act="compose">${esc(pname(other(me)))}にトレードを依頼する</button>
          <p class="small muted">相手が「受ける」を押すまで担当は変わりません。</p>`
        : `<button class="btn" data-act="take">私が引き受ける</button><p class="small muted">${esc(pname(l.who))}への貸しが1回つきます。</p>`}`;
    } else if (sheet.type === 'day') {
      const off = !!S.days[sheet.k]?.off;
      body = `<h2>${fmt(sheet.k)}</h2>${off ? `<p class="muted">この日は送迎なしになっています。</p><button class="btn" data-act="off" data-v="0">送迎ありに戻す</button>`
        : `<p class="muted small">休園日や家族の休みなど、送迎がない日はお休みにすると回数に数えません。</p><button class="btn ghost" data-act="off" data-v="1">この日は送迎なし（お休み）</button>`}`;
    } else if (sheet.type === 'compose') {
      const l = sheet.l, partner = other(me);
      const opts = [];
      for (let i = -3; i < 21; i++) {
        const k = keyOf(addDays(parse(l.date), i));
        if (k < todayKey()) continue;
        for (const x of legsOf(k)) if (x.who === partner && !(x.date === l.date && x.kid === l.kid && x.leg === l.leg)) opts.push(x);
      }
      body = `<div class="tcard"><span class="kind">TRADE ・ 依頼カードをつくる</span><span class="main">${esc(legLabel(l))}</span>
        <span class="arrow">${esc(pname(me))} → <b>${esc(pname(partner))}</b> に代わってほしい</span></div>
        <label class="f">お返しに引き受ける担当（任意）<select id="ret"><option value="">なし（借り1回として記録）</option>
          ${opts.map(x => `<option value="${esc(JSON.stringify({ date: x.date, kid: x.kid, leg: x.leg }))}">${esc(legLabel(x))}</option>`).join('')}</select></label>
        <label class="f">ひとこと<textarea id="note" placeholder="例：急な会議が入っちゃった、ごめん！"></textarea></label>
        <div class="chips">${REASONS.map(r => `<button data-act="reason" data-r="${r}">${r}</button>`).join('')}</div>
        <div class="preview" id="preview"></div>
        <button class="btn card" data-act="send">トレード依頼を送る</button>`;
    }
    overlay.innerHTML = `<div class="scrim" data-act="close"><div class="sheet" role="dialog" aria-modal="true"><button class="x" data-act="close">閉じる</button>${body}</div></div>`;
    if (sheet.type === 'compose') updatePreview();
  }
  function updatePreview() {
    const el = document.getElementById('preview'); if (!el || !sheet?.l) return;
    const retv = document.getElementById('ret').value;
    const ret = retv ? JSON.parse(retv) : null;
    el.innerHTML = `<b>成立すると</b><span>・${esc(legLabel(sheet.l))} → ${esc(pname(other(me)))}</span>` +
      (ret ? `<span>・${esc(legLabel(ret))} → ${esc(pname(me))}</span>` : `<span>・${esc(pname(me))} に借りが1回つきます</span>`) +
      `<span class="small muted">それ以外の担当は変わりません。</span>`;
  }
  function closeSheet() { sheet = null; renderSheet(); }

  let toastTimer;
  function toast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg; t.hidden = false;
    clearTimeout(toastTimer); toastTimer = setTimeout(() => t.hidden = true, 3200);
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const el = e.target.closest('[data-act]'); if (!el) return;
    const a = el.dataset.act;
    if (a === 'close') { if (e.target === el || el.classList.contains('x')) closeSheet(); return; }
    if (a === 'tab') { view = el.dataset.v; sheet = null; if (view === 'settings') draft = freshDraft(); render(); window.scrollTo(0, 0); }
    else if (a === 'me') { me = el.dataset.p; lsSet(LS_ME, me); render(); }
    else if (a === 'switchme') { me = null; render(); }
    else if (a === 'leg') { sheet = { type: 'leg', k: el.dataset.k, kid: el.dataset.kid, leg: el.dataset.leg }; renderSheet(); }
    else if (a === 'day') { sheet = { type: 'day', k: el.dataset.k }; renderSheet(); }
    else if (a === 'compose') { sheet = { type: 'compose', l: { date: sheet.k, kid: sheet.kid, leg: sheet.leg } }; renderSheet(); }
    else if (a === 'take') { takeOver({ date: sheet.k, kid: sheet.kid, leg: sheet.leg, who: whoFor(sheet.k, sheet.kid, sheet.leg) }); }
    else if (a === 'off') { setOff(sheet.k, el.dataset.v === '1'); }
    else if (a === 'reason') { const n = document.getElementById('note'); n.value = n.value ? `${n.value} ${el.dataset.r}` : el.dataset.r; }
    else if (a === 'send') { sendTrade(sheet.l, document.getElementById('ret').value, document.getElementById('note').value); }
    else if (a === 'yes' || a === 'no') { answer(el.dataset.id, a === 'yes'); }
    else if (a === 'cancel') { cancelTrade(el.dataset.id); }
    else if (a === 'month') { monthOffset += Number(el.dataset.d); render(); }
    else if (a === 'addkid') { draft.kids.push({ id: newId(), name: '', school: '' }); render(); }
    else if (a === 'delkid') { draft.kids.splice(Number(el.dataset.i), 1); render(); }
    else if (a === 'wd') { const w = Number(el.dataset.w); draft.weekdays = draft.weekdays.includes(w) ? draft.weekdays.filter(x => x !== w) : [...draft.weekdays, w]; render(); }
    else if (a === 'cell') {
      const w = el.dataset.w, i = Number(el.dataset.i), leg = el.dataset.leg;
      draft.pattern[w] = draft.pattern[w] || {};
      draft.pattern[w][legKey(draft.kids[i].id, leg)] = other(draftWho(w, i, leg));
      render();
    }
    else if (a === 'save') saveSettings();
  });
  document.addEventListener('input', e => {
    const el = e.target, f = el.dataset.f; if (!f || !draft) return;
    if (f === 'name') draft.names[el.dataset.p] = el.value;
    else if (f === 'kid') draft.kids[Number(el.dataset.i)].name = el.value;
    else if (f === 'school') draft.kids[Number(el.dataset.i)].school = el.value;
  });
  document.addEventListener('change', e => { if (e.target.id === 'ret') updatePreview(); });

  async function saveSettings() {
    const names = { a: draft.names.a.trim(), b: draft.names.b.trim() };
    if (!names.a || !names.b) return toast('ふたりの呼び名を入れてください');
    const kids = draft.kids.map(k => ({ ...k, name: k.name.trim(), school: (k.school || '').trim() })).filter(k => k.name);
    if (!kids.length) return toast('子どもの名前を1人以上入れてください');
    if (!draft.weekdays.length) return toast('送迎する曜日を1つ以上選んでください');
    const pattern = {};
    for (let w = 0; w < 7; w++) {
      pattern[w] = {};
      kids.forEach((k, i) => ['drop', 'pick'].forEach(leg => {
        pattern[w][legKey(k.id, leg)] = draft.pattern?.[w]?.[legKey(k.id, leg)] || defaultWho(draft.kids.findIndex(x => x.id === k.id), leg);
      }));
    }
    const first = !S.settings;
    await store.put('settings', null, { names, kids, weekdays: [...draft.weekdays].sort(), pattern, startDate: S.settings?.startDate || todayKey(), updatedAt: Date.now() });
    draft = null; view = 'home';
    toast(first ? '登録しました' : '保存しました');
    render();
  }

  render();
  store.init();
})();
</script>
